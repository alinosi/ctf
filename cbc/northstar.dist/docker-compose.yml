services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northstar-ops-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - northstar-network

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: northstar-ops-proxy
    depends_on:
      - app
    ports:
      - "${PROXY_PUBLIC_PORT:-8080}:8080"
    environment:
      - UPSTREAM_BASE=http://app:3000
      - PROXY_PORT=8080
    restart: unless-stopped
    networks:
      - northstar-network

networks:
  northstar-network:
    driver: bridge
